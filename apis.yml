aid: linte
name: Linte
description: Linte is a Brazilian legal-technology company offering an AI-powered contract
  lifecycle management (CLM) platform for large enterprises. Its product family spans
  Linte CLM for document automation and contract lifecycle governance, Linte AI for
  contract review that summarizes versions and flags risk against a customer playbook,
  Linte BI for contract analytics dashboards, and Linte Intake for legal demand intake
  and triage. The platform integrates natively with digital signature providers including
  ClickSign, DocuSign and D4Sign, and is sold to enterprise legal, procurement and
  compliance teams primarily in Brazil. Linte publishes no public API program, developer
  portal or API reference; its only public developer-facing artifacts are npm-published
  embeddable "Linte Docs" form components.
